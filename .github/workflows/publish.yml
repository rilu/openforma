name: Publish NuGet

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Validate release tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(?<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$') {
            throw "Release tags must look like v0.1.0 or v0.2.0-rc.1."
          }
          "value=$($Matches.version)" >> $env:GITHUB_OUTPUT
  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.value }}
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: artifacts/packages
      - name: Authenticate with NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish verified package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        run: dotnet nuget push "artifacts/packages/OpenForma.$PACKAGE_VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
